<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#fff8ef" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="かいものルート" />
    <meta
      name="description"
      content="買い物リストから売り場を特定し、スーパー店内の最短ルートを作成するアプリ"
    />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap"
    />
    <title>かいものルート</title>
    <script>
      // 保存済みのテーマを描画前に適用する (アプリ起動時に既定色が一瞬見えるのを防ぐ)。
      // 読めなくても実害はないので、失敗は握りつぶして React 側の適用に任せる。
      try {
        var saved = JSON.parse(localStorage.getItem('smart-shopping-list') || '{}')
        var theme = saved && saved.state && saved.state.theme
        if (theme && theme !== 'default') document.documentElement.setAttribute('data-theme', theme)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
